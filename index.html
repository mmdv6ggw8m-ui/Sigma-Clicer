<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGMA CLICKER</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 40%, #303030 0%, #111 45%, #050505 100%);
            color: white;
            user-select: none;
        }
        .game {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
        }
        /* Заголовок */
        .title {
            position: absolute;
            top: 45px;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow:
                0 0 10px rgba(255,255,255,0.25),
                0 0 25px rgba(255,255,255,0.1);
        }
        .subtitle {
            position: absolute;
            top: 85px;
            font-size: 13px;
            color: #999;
            letter-spacing: 2px;
        }
        /* Счёт */
        .score-box {
            position: absolute;
            top: 125px;
            text-align: center;
        }
        .score-label {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .score {
            margin-top: 5px;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(
                180deg,
                #ffffff,
                #aaa
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transition: transform 0.1s;
        }
        .score.bump {
            transform: scale(1.15);
        }
        /* Кнопка */
        .sigma-button {
            width: 230px;
            height: 230px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #555,
                    #222 45%,
                    #090909 100%
                );
            box-shadow:
                0 0 0 5px rgba(255,255,255,0.05),
                0 20px 50px rgba(0,0,0,0.7),
                inset 0 3px 8px rgba(255,255,255,0.15),
                inset 0 -10px 20px rgba(0,0,0,0.8);
            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease;
        }
        /* Светящийся круг вокруг */
        .sigma-button::before {
            content: "";
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow:
                0 0 30px rgba(255,255,255,0.08);
            animation: pulse 2.5s infinite ease-in-out;
        }
        /* Блик */
        .sigma-button::after {
            content: "";
            position: absolute;
            width: 80px;
            height: 35px;
            top: 28px;
            left: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            filter: blur(8px);
            transform: rotate(-25deg);
        }
        .sigma-button:active {
            transform: scale(0.91);
            box-shadow:
                0 0 0 5px rgba(255,255,255,0.08),
                0 8px 20px rgba(0,0,0,0.8),
                inset 0 5px 15px rgba(0,0,0,0.8);
        }
        /* Сигма */
        .sigma {
            font-family: Georgia, serif;
            font-size: 145px;
            font-weight: bold;
            line-height: 1;
            color: #f2f2f2;
            text-shadow:
                0 3px 0 #777,
                0 5px 15px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
        }
        /* Надпись */
        .hint {
            position: absolute;
            bottom: 75px;
            color: #777;
            font-size: 13px;
            letter-spacing: 1px;
        }
        /* +1 */
        .floating-text {
            position: absolute;
            pointer-events: none;
            font-size: 25px;
            font-weight: 900;
            color: white;
            text-shadow:
                0 2px 10px rgba(255,255,255,0.5);
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -100px) scale(1.4);
            }
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }
        /* Маленькие экраны */
        @media (max-height: 650px) {
            .sigma-button {
                width: 180px;
                height: 180px;
            }
            .sigma {
                font-size: 110px;
            }
            .score-box {
                top: 100px;
            }
            .title {
                top: 25px;
            }
            .subtitle {
                top: 65px;
            }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="title">SIGMA CLICKER</div>
    <div class="subtitle">
        BECOME THE SIGMA
    </div>
    <div class="score-box">
        <div class="score-label">Очки сигмы</div>
        <div class="score" id="score">0</div>
    </div>
    <button class="sigma-button" id="sigmaButton">
        <span class="sigma">Σ</span>
    </button>
    <div class="hint">
        НАЖИМАЙ НА Σ
    </div>
</div>
<script>
    // Подключение Telegram Web App
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }
    // Переменные игры
    let score = 0;
    const button = document.getElementById("sigmaButton");
    const scoreElement = document.getElementById("score");
    // Клик по сигме
    button.addEventListener("click", function(event) {
        // +1 очко
        score++;
        // Обновляем счётчик
        scoreElement.textContent = score;
        // Анимация счётчика
        scoreElement.classList.remove("bump");
        // Нужно немного подождать,
        // чтобы браузер заново запустил анимацию
        void scoreElement.offsetWidth;
        scoreElement.classList.add("bump");
        // Создаём надпись +1
        const plusOne = document.createElement("div");
        plusOne.className = "floating-text";
        plusOne.textContent = "+1";
        // Позиция около места нажатия
        plusOne.style.left = event.clientX + "px";
        plusOne.style.top = event.clientY + "px";
        document.body.appendChild(plusOne);
        // Удаляем надпись после анимации
        setTimeout(() => {
            plusOne.remove();
        }, 800);
        // Лёгкая вибрация телефона
        if (navigator.vibrate) {
            navigator.vibrate(20);
        }
    });
</script>
</body>
</html>
