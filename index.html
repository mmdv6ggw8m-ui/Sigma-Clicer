<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <title>SIGMA CLICKER</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #303030, #111 70%);
            color: white;
            overflow-x: hidden;
        }

        .game {
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 32px;
            font-weight: 900;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
        }

        /* СЧЁТ */

        .score-box {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px;
            padding: 15px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .score-title {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 2px;
        }

        #score {
            font-size: 48px;
            font-weight: 900;
            margin-top: 3px;
        }

        /* КНОПКА SIGMA */

        .sigma-button {
            width: 230px;
            height: 230px;

            border-radius: 50%;
            border: 8px solid #444;

            background:
                radial-gradient(circle at 35% 30%, #777, #333 55%, #181818);

            box-shadow:
                0 20px 45px rgba(0,0,0,0.5),
                inset 0 5px 15px rgba(255,255,255,0.15),
                inset 0 -10px 20px rgba(0,0,0,0.5);

            font-size: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto;

            cursor: pointer;
            user-select: none;

            transition: transform 0.1s;
        }

        .sigma-button:active {
            transform: scale(0.90);
        }

        .sigma-button.hit {
            animation: sigmaHit 0.25s;
        }

        @keyframes sigmaHit {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.12) rotate(-3deg);
            }

            70% {
                transform: scale(0.95) rotate(3deg);
            }

            100% {
                transform: scale(1);
            }
        }

        .multiplier {
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        /* КНОПКИ */

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .control-button {
            flex: 1;
            border: none;
            border-radius: 15px;
            padding: 13px 5px;

            background: #292929;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .control-button:active {
            transform: scale(0.96);
        }

        .auto-on {
            background: #2d8a4b;
        }

        /* МАГАЗИН */

        .shop {
            margin-top: 25px;
            text-align: left;
        }

        .shop-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .shop-item {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 17px;

            padding: 15px;
            margin-bottom: 10px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-name {
            font-size: 17px;
            font-weight: bold;
        }

        .item-price {
            color: #aaa;
            font-size: 13px;
            margin-top: 4px;
        }

        .buy-button {
            border: none;
            border-radius: 12px;
            padding: 10px 15px;

            background: #fff;
            color: #111;

            font-weight: bold;
            cursor: pointer;
        }

        .buy-button:disabled {
            background: #444;
            color: #888;
            cursor: default;
        }

        /* +ОЧКИ */

        .plus {
            position: fixed;
            pointer-events: none;

            font-size: 27px;
            font-weight: 900;

            color: #fff;

            animation: fly 0.7s forwards;
        }

        @keyframes fly {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.4);
            }
        }

        /* УВЕДОМЛЕНИЕ */

        .message {
            position: fixed;
            left: 50%;
            bottom: 25px;

            transform: translateX(-50%) translateY(100px);

            background: #222;
            color: white;

            padding: 12px 20px;
            border-radius: 15px;

            opacity: 0;
            transition: 0.3s;

            pointer-events: none;
            z-index: 100;
        }

        .message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .reset {
            margin-top: 15px;
            background: transparent;
            color: #777;
            border: none;
            font-size: 12px;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🗿 SIGMA CLICKER</h1>

    <div class="subtitle">
        Кликни на Сигму
    </div>

    <div class="score-box">
        <div class="score-title">SIGMA POINTS</div>
        <div id="score">0</div>
    </div>

    <!-- КНОПКА КОТИКА ЗАМЕНЕНА НА SIGMA -->
    <button class="sigma-button" id="sigmaButton">
        🗿
    </button>

    <div class="multiplier">
        Сила клика: ×<span id="multiplier">1</span>
    </div>

    <div class="buttons">

        <button class="control-button" onclick="refreshGame()">
            🔄 Обновить
        </button>

        <button class="control-button" id="autoButton"
                onclick="toggleAutoClicker()">
            🤖 Автоклик
        </button>

    </div>


    <!-- МАГАЗИН -->

    <div class="shop">

        <div class="shop-title">
            🛒 Магазин
        </div>

        <div class="shop-item">

            <div>
                <div class="item-name">⚡ Клик ×2</div>
                <div class="item-price">100 очков</div>
            </div>

            <button class="buy-button"
                    id="buy2"
                    onclick="buyMultiplier(2, 100)">
                Купить
            </button>

        </div>


        <div class="shop-item">

            <div>
                <div class="item-name">🔥 Клик ×5</div>
                <div class="item-price">500 очков</div>
            </div>

            <button class="buy-button"
                    id="buy5"
                    onclick="buyMultiplier(5, 500)">
                Купить
            </button>

        </div>


        <div class="shop-item">

            <div>
                <div class="item-name">💀 Клик ×100</div>
                <div class="item-price">1000 очков</div>
            </div>

            <button class="buy-button"
                    id="buy100"
                    onclick="buyMultiplier(100, 1000)">
                Купить
            </button>

        </div>

    </div>


    <button class="reset" onclick="resetGame()">
        🗑️ Сбросить весь прогресс
    </button>

</div>


<div class="message" id="message"></div>


<script>

    /* =========================================
       TELEGRAM
    ========================================= */

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /* =========================================
       СОСТОЯНИЕ ИГРЫ
    ========================================= */

    let score = Number(localStorage.getItem("sigmaScore")) || 0;

    let multiplier =
        Number(localStorage.getItem("sigmaMultiplier")) || 1;

    let autoClicker =
        localStorage.getItem("sigmaAuto") === "true";


    /* =========================================
       ЭЛЕМЕНТЫ
    ========================================= */

    const scoreElement =
        document.getElementById("score");

    const multiplierElement =
        document.getElementById("multiplier");

    const sigmaButton =
        document.getElementById("sigmaButton");

    const autoButton =
        document.getElementById("autoButton");


    /* =========================================
       ОБНОВЛЕНИЕ ЭКРАНА
    ========================================= */

    function updateScreen() {

        scoreElement.textContent =
            score.toLocaleString("ru-RU");

        multiplierElement.textContent =
            multiplier;

        updateShop();

        if (autoClicker) {

            autoButton.textContent =
                "🛑 Автоклик: ВКЛ";

            autoButton.classList.add("auto-on");

        } else {

            autoButton.textContent =
                "🤖 Автоклик";

            autoButton.classList.remove("auto-on");
        }
    }


    /* =========================================
       СОХРАНЕНИЕ
    ========================================= */

    function saveGame() {

        localStorage.setItem(
            "sigmaScore",
            score
        );

        localStorage.setItem(
            "sigmaMultiplier",
            multiplier
        );

        localStorage.setItem(
            "sigmaAuto",
            autoClicker
        );
    }


    /* =========================================
       КЛИК
    ========================================= */

    function clickSigma(event, showAnimation = true) {

        score += multiplier;

        updateScreen();
        saveGame();


        if (showAnimation) {

            sigmaButton.classList.remove("hit");

            void sigmaButton.offsetWidth;

            sigmaButton.classList.add("hit");


            createPlus(
                event.clientX,
                event.clientY,
                "+" + multiplier
            );
        }
    }


    sigmaButton.addEventListener("click", function(event) {

        clickSigma(event, true);

    });


    /* =========================================
       +ОЧКИ
    ========================================= */

    function createPlus(x, y, text) {

        const plus =
            document.createElement("div");

        plus.className = "plus";

        plus.textContent = text;

        plus.style.left = x + "px";
        plus.style.top = y + "px";

        document.body.appendChild(plus);

        setTimeout(function() {

            plus.remove();

        }, 700);
    }


    /* =========================================
       МАГАЗИН
    ========================================= */

    function buyMultiplier(newMultiplier, price) {

        if (multiplier >= newMultiplier) {

            showMessage(
                "Это усиление уже куплено"
            );

            return;
        }


        if (score < price) {

            showMessage(
                "Не хватает очков!"
            );

            return;
        }


        score -= price;

        multiplier = newMultiplier;

        saveGame();

        updateScreen();

        showMessage(
            "Клик теперь ×" + newMultiplier + "!"
        );
    }


    function updateShop() {

        const buy2 =
            document.getElementById("buy2");

        const buy5 =
            document.getElementById("buy5");

        const buy100 =
            document.getElementById("buy100");


        buy2.disabled =
            multiplier >= 2;

        buy5.disabled =
            multiplier >= 5;

        buy100.disabled =
            multiplier >= 100;


        if (multiplier >= 2) {
            buy2.textContent = "✓ Куплено";
        }

        if (multiplier >= 5) {
            buy5.textContent = "✓ Куплено";
        }

        if (multiplier >= 100) {
            buy100.textContent = "✓ Куплено";
        }
    }


    /* =========================================
       АВТОКЛИКЕР
    ========================================= */

    let autoInterval = null;


    function toggleAutoClicker() {

        autoClicker = !autoClicker;

        saveGame();

        updateScreen();

        if (autoClicker) {

            startAutoClicker();

            showMessage(
                "Автокликер включён!"
            );

        } else {

            stopAutoClicker();

            showMessage(
                "Автокликер выключен"
            );
        }
    }


    function startAutoClicker() {

        stopAutoClicker();

        autoInterval = setInterval(function() {

            score += multiplier;

            updateScreen();

            saveGame();

        }, 1000);
    }


    function stopAutoClicker() {

        if (autoInterval !== null) {

            clearInterval(autoInterval);

            autoInterval = null;
        }
    }


    /* =========================================
       ОБНОВИТЬ РЕЗУЛЬТАТ
    ========================================= */

    function refreshGame() {

        score =
            Number(localStorage.getItem(
                "sigmaScore"
            )) || 0;

        multiplier =
            Number(localStorage.getItem(
                "sigmaMultiplier"
            )) || 1;

        autoClicker =
            localStorage.getItem(
                "sigmaAuto"
            ) === "true";


        if (autoClicker) {

            startAutoClicker();

        } else {

            stopAutoClicker();
        }


        updateScreen();

        showMessage(
            "Результат обновлён"
        );
    }


    /* =========================================
       ПОЛНЫЙ СБРОС
    ========================================= */

    function resetGame() {

        const answer =
            confirm(
                "Точно удалить весь прогресс?"
            );

        if (!answer) return;


        score = 0;

        multiplier = 1;

        autoClicker = false;


        localStorage.removeItem(
            "sigmaScore"
        );

        localStorage.removeItem(
            "sigmaMultiplier"
        );

        localStorage.removeItem(
            "sigmaAuto"
        );


        stopAutoClicker();

        updateScreen();

        showMessage(
            "Прогресс полностью сброшен"
        );
    }


    /* =========================================
       УВЕДОМЛЕНИЕ
    ========================================= */

    let messageTimer;


    function showMessage(text) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.classList.add("show");


        clearTimeout(messageTimer);


        messageTimer = setTimeout(function() {

            message.classList.remove("show");

        }, 1800);
    }


    /* =========================================
       ЗАПУСК
    ========================================= */

    updateScreen();


    if (autoClicker) {

        startAutoClicker();
    }

</script>

</body>
</html>
